<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 명탐정</title>
    <style>
        :root {
            --border: #ccc;
            --purple: #8e44ad;
        }
        body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .teacher-section { border: 1px solid var(--border); padding: 15px; border-radius: 5px; margin-bottom: 15px; }
        .note { font-size: 0.9em; color: #666; }
        .setting { margin-bottom: 10px; display: flex; flex-direction: column; }
        .setting input, .setting select { padding: 8px; margin-top: 5px; }
        .btn { padding: 10px 15px; cursor: pointer; border: none; border-radius: 5px; }
        .btn.primary { background-color: var(--purple); color: white; }
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: 5px; display: none; }
    </style>
</head>
<body>

    <!-- 학생 화면 영역 예시 -->
    <div id="studentArea">
        <h2>🕵️‍♂️ AI 명탐정 미션</h2>
        <p>단어를 조합해 목표 이미지를 만들어보세요!</p>
        <!-- 테스트용 이미지 생성 버튼 -->
        <button class="btn primary" onclick="runMissionTest()">🎨 테스트: 그림 그리기</button>
        <div id="imageResult" style="margin-top:20px;"></div>
    </div>

    <!-- 선생님 로그인 영역 -->
    <div id="teacherLogin" style="margin-top:50px; border-top: 2px solid #000; padding-top:20px;">
        <h3>👨‍🏫 선생님 설정 모드 로그인</h3>
        <input type="password" id="teacherPw" placeholder="비밀번호(1234)">
        <button class="btn" id="pwBtn">로그인</button>
    </div>

    <!-- 설정 영역 (로그인 후 표시) -->
    <div id="teacherContent" style="display: none; border-top:2px dashed var(--border); margin-top:15px; padding-top:15px;">
        <div class="teacher-section" style="border-top: none; margin-top:5px; padding-top:5px;">
            <h3 style="margin-top:0; color: var(--purple);">🔑 Gemini API Key 설정</h3>
            <p class="note">깃허브/버셀 배포 시 보안을 위해 API 키는 브라우저에만 저장하세요.</p>
            <div class="setting">
                <label style="flex:100%">Gemini API Key
                    <input type="password" id="apiKeyInput" placeholder="발급받은 AI API 키를 입력하세요">
                </label>
            </div>
            <button class="btn primary" id="saveApiKeyBtn" style="width:100%; margin-top:10px;">💾 API 키 저장하기</button>
        </div>

        <div class="setting" style="margin-top: 25px;">
            <label style="flex:100%">바로가기 미션 선택
                <select id="missionSelect">
                    <option value="1">미션 1</option>
                    <option value="2">미션 2</option>
                </select>
            </label>
        </div>
        
        <div class="teacher-section">
            <h3 style="margin-top:0">📸 단계별 목표 그림(이미지) 직접 등록</h3>
            <p class="note">미션별로 등록된 실제 일러스트를 확인하거나 변경할 수 있습니다.</p>
            <div id="missionManagerList"></div>
            <button class="btn" id="addMissionBtn" style="margin-top: 10px;">➕ 미션 추가</button>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        // --- 1. 유틸리티 함수 ---
        const el = id => document.getElementById(id);
        
        function showToast(msg) {
            const toast = el('toast');
            toast.textContent = msg;
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        function speak(text) {
            // TTS 음성 출력 대체 콘솔
            console.log("음성 출력:", text);
            // 실제 웹 스피치 API 연동시 아래 주석 해제
            /*
            const utterance = new SpeechSynthesisUtterance(text);
            speechSynthesis.speak(utterance);
            */
        }

        function start(missionId) {
            console.log(missionId + "번 미션 시작");
            showToast(missionId + "번 미션으로 변경되었습니다.");
        }

        function renderMissionManager() {
            el('missionManagerList').innerHTML = "<p style='color:green;'>✅ 미션 리스트가 성공적으로 로드되었습니다.</p>";
        }

        // --- 2. 오류 수정된 AI 이미지 생성 함수 (Imagen 3 모델) ---
        async function generateAIImage(promptText) {
            let apiKey = '';
            try {
                if (typeof process !== 'undefined' && process.env && process.env.GEMINI_API_KEY) {
                    apiKey = process.env.GEMINI_API_KEY;
                }
            } catch(e) {}
            
            if (!apiKey) {
                apiKey = localStorage.getItem('Gemini API Key'); 
            }

            if (!apiKey) {
                showToast('API 키가 없습니다. 선생님 설정에서 API 키를 입력해주세요!');
                throw new Error("API Key is missing");
            }
            
            // Imagen 3 이미지 생성 API 주소로 수정
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-001:predict?key=${apiKey}`;
            const enhancedPrompt = `어린이 동화책에 나오는 귀엽고 따뜻한 느낌의 3D 렌더링 일러스트 스타일로 다음 내용을 그려주세요: ${promptText}. 폭력적이거나 복잡한 요소 금지.`;
            
            // 이미지 생성을 위한 payload 구조로 수정
            const payload = {
                instances: [
                    { prompt: enhancedPrompt }
                ],
                parameters: {
                    sampleCount: 1,
                    aspectRatio: "1:1"
                }
            };
            
            try {
                showToast("AI가 그림을 그리고 있어요. 잠시만 기다려주세요!");
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    console.error("API Error Details:", errorData);
                    throw new Error("이미지 생성에 실패했습니다.");
                }

                const data = await response.json();

                // Base64 데이터를 추출하여 이미지 src 형식으로 변환
                if (data.predictions && data.predictions.length > 0) {
                    const base64Image = data.predictions[0].bytesBase64Encoded;
                    return `data:image/jpeg;base64,${base64Image}`;
                } else {
                    throw new Error("이미지 데이터가 반환되지 않았습니다.");
                }

            } catch (error) {
                console.error("AI 이미지 생성 오류:", error);
                showToast("그림을 그리는 중 문제가 발생했어요. 선생님께 알려주세요!");
                return null;
            }
        }

        // --- 테스트용 버튼 함수 ---
        async function runMissionTest() {
            const promptText = "빨간 모자를 쓰고 숲속을 걷는 귀여운 곰돌이";
            const imageUrl = await generateAIImage(promptText);
            if (imageUrl) {
                el('imageResult').innerHTML = `<img src="${imageUrl}" alt="AI 생성 이미지" style="max-width:100%; max-height:400px; border-radius:10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">`;
                speak('앗 조금 달라요. 목표 그림과 비교해 보세요.');
            }
        }

        // --- 3. 이벤트 바인딩 (초기화) ---
        window.onload = () => {
            const missionSelect = el('missionSelect');
            if(missionSelect) missionSelect.onchange = e => start(Number(e.target.value));

            // 선생님 로그인
            const pwBtn = el('pwBtn');
            if(pwBtn) {
                pwBtn.onclick = () => {
                    const pwInput = el('teacherPw');
                    if(pwInput && pwInput.value === '1234') {
                        const loginDiv = el('teacherLogin');
                        const contentDiv = el('teacherContent');
                        if(loginDiv) loginDiv.style.display = 'none';
                        if(contentDiv) contentDiv.style.display = 'block';
                        
                        let savedApiKey = '';
                        try {
                            if (typeof process !== 'undefined' && process.env && process.env.GEMINI_API_KEY) {
                                savedApiKey = process.env.GEMINI_API_KEY;
                            }
                        } catch(e) {}
                        
                        if (!savedApiKey) {
                            savedApiKey = localStorage.getItem('Gemini API Key');
                        }

                        const apiKeyInput = el('apiKeyInput');
                        if(apiKeyInput) {
                            apiKeyInput.value = savedApiKey || '';
                            if (savedApiKey && typeof process !== 'undefined' && process.env && process.env.GEMINI_API_KEY) {
                                apiKeyInput.placeholder = "환경변수(GEMINI_API_KEY) 적용 중";
                                apiKeyInput.disabled = true;
                            }
                        }
                        
                        renderMissionManager();
                        showToast('선생님 모드로 로그인되었습니다.');
                    } else {
                        showToast('비밀번호가 틀렸습니다.');
                    }
                };
            }

            // API 키 저장
            const saveApiKeyBtn = el('saveApiKeyBtn');
            if(saveApiKeyBtn) {
                saveApiKeyBtn.onclick = () => {
                    const keyInput = el('apiKeyInput');
                    if(keyInput) {
                        const key = keyInput.value.trim();
                        if(key) {
                            localStorage.setItem('Gemini API Key', key);
                            showToast('✅ Gemini API Key가 안전하게 저장되었습니다!');
                        } else {
                            localStorage.removeItem('Gemini API Key');
                            showToast('API 키가 삭제되었습니다.');
                        }
                    }
                };
            }

            // 미션 추가 버튼
            const addMissionBtn = el('addMissionBtn');
            if(addMissionBtn) {
                addMissionBtn.onclick = () => {
                    showToast("미션 추가 기능이 호출되었습니다.");
                };
            }
        };
    </script>
</body>
</html>
